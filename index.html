<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="theme-color" content="#090e17">
  <meta name="description" content="AEROFY · Dashboard Monitoring Telemetry ESP32 untuk Lingkungan Budidaya.">
  <title>AEROFY · Telemetry Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #060a12;
      --bg2:        #0d1422;
      --bg3:        #111928;
      --border:     rgba(255,255,255,0.07);
      --accent:     #3b82f6;
      --accent2:    #06b6d4;
      --green:      #22c55e;
      --yellow:     #eab308;
      --red:        #ef4444;
      --purple:     #a855f7;
      --orange:     #f97316;
      --text:       #e2e8f0;
      --muted:      #64748b;
      --glass:      rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.09);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── BG GLOW ── */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(59,130,246,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(6,182,212,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(6,10,18,0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
    }
    .logo h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
      display: block;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--glass-border);
      background: var(--glass);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    .status-dot.loading { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
    .status-dot.error   { background: var(--red);    box-shadow: 0 0 8px var(--red); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── MAIN ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* ── TIME BAR ── */
    .time-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .time-bar .label {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .time-bar .value {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent2);
    }
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .refresh-btn:hover { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── SENSOR GRID ── */
    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    /* ── CARD ── */
    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.16); }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--card-accent, var(--accent)), transparent);
      opacity: 0.6;
    }
    .card-icon {
      font-size: 1.4rem;
      margin-bottom: 12px;
      display: block;
    }
    .card-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .card-value {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      color: var(--card-accent, var(--text));
    }
    .card-unit {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: 4px;
    }
    .card-bar {
      margin-top: 14px;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .card-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--card-accent, var(--accent)), var(--card-accent2, var(--accent2)));
      border-radius: 99px;
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── CHART PANEL ── */
    .chart-panel {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .chart-title {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .chart-tabs {
      display: flex;
      gap: 6px;
    }
    .chart-tab {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chart-tab.active, .chart-tab:hover {
      background: rgba(59,130,246,0.18);
      border-color: rgba(59,130,246,0.5);
      color: var(--text);
    }
    .chart-wrap {
      position: relative;
      height: 240px;
    }

    /* ── HISTORY TABLE ── */
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    thead tr {
      background: rgba(255,255,255,0.04);
    }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--text);
      white-space: nowrap;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    /* ── FOOTER ── */
    footer {
      position: relative; z-index: 1;
      text-align: center;
      padding: 20px;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      main   { padding: 20px 16px 50px; }
      .card-value { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">💧</div>
    <div>
      <h1>AEROFY</h1>
      <span>ESP32 Telemetry Dashboard</span>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot loading" id="statusDot"></div>
    <span id="statusText">Memuat data...</span>
  </div>
</header>

<main>
  <div class="time-bar">
    <div>
      <div class="label">Data terakhir</div>
      <div class="value" id="lastUpdate">—</div>
    </div>
    <button class="refresh-btn" onclick="fetchData()">
      🔄 Refresh
    </button>
  </div>

  <!-- SENSOR CARDS -->
  <div class="section-title">📡 Sensor Terkini</div>
  <div class="sensor-grid" id="sensorGrid">
    <!-- Filled by JS -->
  </div>

  <!-- CHART -->
  <div class="section-title">📈 Riwayat 20 Data Terakhir</div>
  <div class="chart-panel">
    <div class="chart-header">
      <div class="chart-title" id="chartTitle">Suhu Udara</div>
      <div class="chart-tabs" id="chartTabs"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

  <!-- TABLE -->
  <div class="section-title">📋 Log Data</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr id="tableHead"></tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="11" style="text-align:center;padding:30px;color:var(--muted)">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>
  Data dari <a href="https://docs.google.com/spreadsheets/d/1RFmxVAN5UOsF_h797rr8wS9sNoaZzKi05Ei1o9TicrI" target="_blank">Google Sheets</a>
  &nbsp;·&nbsp; AEROFY Monitoring System &nbsp;·&nbsp; Auto-refresh setiap 30 detik
</footer>

<script>
// ── CONFIG ──────────────────────────────────────────────
const SHEET_ID = '1RFmxVAN5UOsF_h797rr8wS9sNoaZzKi05Ei1o9TicrI';
const REFRESH_MS = 30000;

// ── SENSOR DEFINITIONS ──────────────────────────────────
const SENSORS = [
  { key: 'suhu',  label: 'Suhu Udara',   icon: '🌡️',  unit: '°C',  color: '#f97316', color2: '#fbbf24', min: 0,  max: 50,  precision: 1 },
  { key: 'rh',    label: 'Kelembaban',   icon: '💧',  unit: '%',   color: '#3b82f6', color2: '#06b6d4', min: 0,  max: 100, precision: 0 },
  { key: 'ph',    label: 'pH Air',       icon: '🧪',  unit: 'pH',  color: '#a855f7', color2: '#ec4899', min: 0,  max: 14,  precision: 2 },
  { key: 'turb1', label: 'Kekeruhan 1',  icon: '🌊',  unit: '%',   color: '#06b6d4', color2: '#3b82f6', min: 0,  max: 100, precision: 1 },
  { key: 'turb2', label: 'Kekeruhan 2',  icon: '🌊',  unit: '%',   color: '#06b6d4', color2: '#3b82f6', min: 0,  max: 100, precision: 1 },
  { key: 'co21',  label: 'CO₂ Sensor 1', icon: '☁️',  unit: 'ppm', color: '#64748b', color2: '#94a3b8', min: 400,max: 2000,precision: 0 },
  { key: 'co22',  label: 'CO₂ Sensor 2', icon: '☁️',  unit: 'ppm', color: '#64748b', color2: '#94a3b8', min: 400,max: 2000,precision: 0 },
  { key: 'level1',label: 'Level Air 1',  icon: '📏',  unit: 'cm',  color: '#22c55e', color2: '#86efac', min: 0,  max: 25,  precision: 1 },
  { key: 'level2',label: 'Level Air 2',  icon: '📏',  unit: 'cm',  color: '#22c55e', color2: '#86efac', min: 0,  max: 30,  precision: 1 },
  { key: 'solar', label: 'Panel Surya',  icon: '☀️',  unit: 'V',   color: '#eab308', color2: '#fbbf24', min: 0,  max: 25,  precision: 2 },
];

// ── STATE ────────────────────────────────────────────────
let allRows = [];
let chart = null;
let activeTab = 'suhu';

// ── FETCH GOOGLE SHEETS ──────────────────────────────────
async function fetchData() {
  setStatus('loading', 'Memuat data...');
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
    const res  = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();

    // Extract JSON from JSONP-like response
    const jsonStr = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!jsonStr) throw new Error('Format respons tidak dikenal');

    const data = JSON.parse(jsonStr[1]);
    const cols = data.table.cols.map(c => c.label || c.id);
    const rows = data.table.rows || [];

    // Map to objects
    allRows = rows.map(row => {
      const obj = {};
      cols.forEach((col, i) => {
        const cell = row.c[i];
        obj[col.toLowerCase().trim()] = cell ? (cell.v ?? '') : '';
      });
      return obj;
    }).filter(r => Object.keys(r).length > 0).reverse(); // newest first

    if (allRows.length === 0) throw new Error('Sheet kosong atau tidak ada data');

    renderCards(allRows[0]);
    renderChart(activeTab);
    renderTable(cols, rows);
    document.getElementById('lastUpdate').textContent = allRows[0].timestamp || new Date().toLocaleString('id-ID');
    setStatus('ok', `Online · ${allRows.length} baris`);

  } catch (err) {
    console.error(err);
    setStatus('error', 'Gagal: ' + err.message);
  }
}

// ── SET STATUS ───────────────────────────────────────────
function setStatus(state, msg) {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className = 'status-dot' + (state === 'ok' ? '' : state === 'loading' ? ' loading' : ' error');
  text.textContent = msg;
}

// ── RENDER CARDS ─────────────────────────────────────────
function renderCards(latest) {
  const grid = document.getElementById('sensorGrid');
  grid.innerHTML = SENSORS.map(s => {
    const raw = parseFloat(latest[s.key]);
    const val = isNaN(raw) ? '—' : raw.toFixed(s.precision);
    const pct = isNaN(raw) ? 0 : Math.min(100, Math.max(0, (raw - s.min) / (s.max - s.min) * 100));
    return `
      <div class="card" style="--card-accent:${s.color};--card-accent2:${s.color2}">
        <span class="card-icon">${s.icon}</span>
        <div class="card-label">${s.label}</div>
        <div class="card-value">${val}<span class="card-unit">${s.unit}</span></div>
        <div class="card-bar"><div class="card-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
  }).join('');
}

// ── RENDER CHART ─────────────────────────────────────────
function renderChart(sensorKey) {
  activeTab = sensorKey;
  const s = SENSORS.find(x => x.key === sensorKey);
  if (!s || allRows.length === 0) return;

  document.getElementById('chartTitle').textContent = s.icon + ' ' + s.label;

  const last20 = [...allRows].slice(0, 20).reverse();
  const labels = last20.map(r => {
    const ts = r.timestamp || '';
    const t = ts.split(' ')[1] || ts;
    return t.slice(0, 5);
  });
  const values = last20.map(r => parseFloat(r[sensorKey]) || 0);

  // Update tabs
  document.getElementById('chartTabs').innerHTML = SENSORS.map(x =>
    `<button class="chart-tab${x.key===sensorKey?' active':''}" onclick="renderChart('${x.key}')">${x.icon} ${x.label}</button>`
  ).join('');

  const ctx = document.getElementById('mainChart').getContext('2d');
  if (chart) chart.destroy();

  const gradient = ctx.createLinearGradient(0, 0, 0, 240);
  gradient.addColorStop(0, s.color + '55');
  gradient.addColorStop(1, s.color + '00');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: s.label,
        data: values,
        borderColor: s.color,
        backgroundColor: gradient,
        borderWidth: 2.5,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: s.color,
        pointBorderColor: '#060a12',
        pointBorderWidth: 2,
        fill: true,
        tension: 0.4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e293b',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          callbacks: { label: ctx => `${ctx.parsed.y.toFixed(s.precision)} ${s.unit}` }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#64748b', font: { family: 'DM Mono', size: 11 } }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#64748b', font: { family: 'DM Mono', size: 11 },
            callback: v => v + ' ' + s.unit }
        }
      }
    }
  });
}

// ── RENDER TABLE ─────────────────────────────────────────
function renderTable(cols, rawRows) {
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');
  const displayCols = cols.slice(0, 11);

  head.innerHTML = displayCols.map(c => `<th>${c}</th>`).join('');

  const last20 = rawRows.slice(-20).reverse();
  if (last20.length === 0) {
    body.innerHTML = `<tr><td colspan="${displayCols.length}" style="text-align:center;padding:30px;color:var(--muted)">Belum ada data</td></tr>`;
    return;
  }

  body.innerHTML = last20.map(row =>
    `<tr>${displayCols.map((_,i) => {
      const cell = row.c[i];
      return `<td>${cell ? (cell.f || cell.v || '—') : '—'}</td>`;
    }).join('')}</tr>`
  ).join('');
}

// ── INIT ─────────────────────────────────────────────────
fetchData();
setInterval(fetchData, REFRESH_MS);
</script>

</body>
</html>
